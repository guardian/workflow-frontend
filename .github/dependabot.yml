version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/e2e-tests/images"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "debian"
    ignore:
      - dependency-name: "debian"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"