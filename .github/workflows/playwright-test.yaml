name: playwright-tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright-tests:
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: e2e-tests

    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: workflow-app-token
        with:
          # required
          client-id: ${{ vars.WORKFLOW_APP_CLIENT_ID }}
          private-key: ${{ secrets.WORKFLOW_APP_PRIVATE_KEY }}
          repositories: guardian/workflow
      - name: Check out workflow-frontend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The e2e stack builds the real Datastore service from a
      # guardian/workflow checkout. Locally this is done by
      # e2e-tests/scripts/checkout-datastore; in CI we clone it here instead.
      # stackContainers.ts looks for it at e2e-tests/target/workflow-backend.
      - name: Check out guardian/workflow (Datastore service)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: "${{ steps.workflow-app-token.outputs.token }}"
          repository: guardian/workflow
          path: e2e-tests/target/workflow-backend

      - name: Check out devcontainer-nginx
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: aug24/devcontainer-nginx
          path: e2e-tests/target/devcontainer-nginx

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".tool-versions"
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            e2e-tests/yarn.lock

      - name: Install application dependencies
        working-directory: .
        run: yarn install --frozen-lockfile

      - name: Install e2e dependencies
        run: yarn install --frozen-lockfile

      - name: Cache sbt dependencies (ivy/coursier)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
          key: ${{ runner.os }}-${{ runner.arch }}-sbt-dependencies-${{ hashFiles('**/*.sbt', '**/project/**/*.scala', '**/project/build.properties', '**/.tool-versions') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-sbt-dependencies-

      - name: Prepare sbt cache mounts
        run: |
          mkdir -p "$HOME/.cache/coursier" "$HOME/.ivy2/cache"
          echo "DEVENV_COURSIER_CACHE_MOUNT_DIR=$HOME/.cache/coursier" >> "$GITHUB_ENV"
          echo "DEVENV_IVY_CACHE_MOUNT_DIR=$HOME/.ivy2" >> "$GITHUB_ENV"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-chromium-shell-${{ hashFiles('e2e-tests/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-playwright-chromium-shell-

      - name: Install Playwright Chromium (headless shell only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: yarn playwright install chromium --only-shell

      - name: Verify Chromium can launch
        run: yarn tsx setup/verify-chromium.ts

      - name: Set up local CA for devcontainer-nginx
        id: local-ca
        run: |
          sudo apt-get update
          sudo apt-get install -y mkcert libnss3-tools
          export CAROOT="$HOME/.local/share/mkcert"
          mkcert -install
          echo "certificate=$CAROOT/rootCA.pem" >> "$GITHUB_OUTPUT"
          mkdir -p target/devcontainer-nginx/certs

      - name: Run Playwright tests
        env:
          DEBUG: "testcontainers,testcontainers:build"
          NODE_EXTRA_CA_CERTS: ${{ steps.local-ca.outputs.certificate }}
        run: yarn bddgen && yarn playwright test

      - name: Chromatic - Workflow Frontend
        if: contains(github.event.pull_request.labels.*.name, 'run_chromatic')
        uses: chromaui/action@bb3b582719a93c1828c5e520e62992b2937d7889 # v18.9.4
        with:
          playwright: true
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: e2e-tests
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          CHROMATIC_ARCHIVE_LOCATION: ./target/test-results

      - name: Upload e2e reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            e2e-tests/target/playwright-report/
            e2e-tests/target/cucumber-report/
          retention-days: 14
          if-no-files-found: ignore
