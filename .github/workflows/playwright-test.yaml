name: playwright-tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright-tests:
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: e2e-tests

    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: workflow-app-token
        with:
          # required
          client-id: ${{ vars.WORKFLOW_APP_CLIENT_ID }}
          private-key: ${{ secrets.WORKFLOW_APP_PRIVATE_KEY }}
          repositories: guardian/workflow
      - name: Check out workflow-frontend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The e2e stack builds the real Datastore service from a
      # guardian/workflow checkout. Locally this is done by
      # e2e-tests/scripts/checkout-datastore; in CI we clone it here instead.
      # stackContainers.ts looks for it at e2e-tests/target/workflow-backend.
      - name: Check out guardian/workflow (Datastore service)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: "${{ steps.workflow-app-token.outputs.token }}"
          repository: guardian/workflow
          path: e2e-tests/target/workflow-backend

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.tool-versions'        
          cache: yarn
          cache-dependency-path: e2e-tests/yarn.lock

      - name: Install e2e dependencies
        run: yarn install --frozen-lockfile

      # We only need the headless shell ("skin"), not the full Chromium
      # browser, so use --only-shell. --with-deps also installs the OS
      # libraries the shell needs on the runner.
      - name: Install Playwright Chromium (headless shell only)
        run: yarn playwright install --with-deps chromium --only-shell

      - name: Run Playwright tests
        run: yarn bddgen && yarn playwright test

      # Traces, videos and screenshots are written to target/test-results
      # (see outputDir in playwright.config.ts). Keep them for debugging
      # failed runs.
      - name: Upload Playwright traces and videos
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: e2e-tests/target/test-results
          retention-days: 7
          if-no-files-found: ignore
