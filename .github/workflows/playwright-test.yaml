name: playwright-tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright-tests:
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: e2e-tests

    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: workflow-app-token
        with:
          # required
          client-id: ${{ vars.WORKFLOW_APP_CLIENT_ID }}
          private-key: ${{ secrets.WORKFLOW_APP_PRIVATE_KEY }}
          repositories: guardian/workflow
      - name: Check out workflow-frontend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The e2e stack builds the real Datastore service from a
      # guardian/workflow checkout. Locally this is done by
      # e2e-tests/scripts/checkout-datastore; in CI we clone it here instead.
      # stackContainers.ts looks for it at e2e-tests/target/workflow-backend.
      - name: Check out guardian/workflow (Datastore service)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: "${{ steps.workflow-app-token.outputs.token }}"
          repository: guardian/workflow
          ref: 4b0ead0169ba6ba8258b42e68bbb42a9c8bd6546
          path: e2e-tests/target/workflow-backend

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".tool-versions"
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            e2e-tests/yarn.lock
            .github/workflows/playwright-test.yaml

      - name: Install application dependencies
        working-directory: .
        run: yarn install --frozen-lockfile

      - name: Install e2e dependencies
        run: yarn install --frozen-lockfile

      - name: Cache sbt dependencies (ivy/coursier)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
          key: benchmark-20261029T161034Z-images-${{ runner.os }}-${{ runner.arch }}-sbt-dependencies-${{ hashFiles('**/*.sbt', '**/project/**/*.scala', '**/project/build.properties', '**/.tool-versions') }}
          restore-keys: |
            benchmark-20261029T161034Z-images-${{ runner.os }}-${{ runner.arch }}-sbt-dependencies-

      - name: Prepare sbt cache mounts
        run: |
          mkdir -p "$HOME/.cache/coursier" "$HOME/.ivy2/cache"
          echo "DEVENV_COURSIER_CACHE_MOUNT_DIR=$HOME/.cache/coursier" >> "$GITHUB_ENV"
          echo "DEVENV_IVY_CACHE_MOUNT_DIR=$HOME/.ivy2" >> "$GITHUB_ENV"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: benchmark-20261029T161034Z-images-${{ runner.os }}-${{ runner.arch }}-playwright-chromium-shell-${{ hashFiles('e2e-tests/yarn.lock') }}
          restore-keys: |
            benchmark-20261029T161034Z-images-${{ runner.os }}-${{ runner.arch }}-playwright-chromium-shell-

      - name: Install Playwright Chromium (headless shell only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: yarn playwright install chromium --only-shell

      - name: Verify Chromium can launch
        run: yarn tsx setup/verify-chromium.ts

      - name: Prepare toolchain image build contexts
        working-directory: .
        run: |
          mkdir -p target/workflow-build-context e2e-tests/target/datastore-build-context
          cp .tool-versions e2e-tests/images/workflow-frontend.Dockerfile target/workflow-build-context/
          cp e2e-tests/target/workflow-backend/.tool-versions e2e-tests/images/datastore.Dockerfile e2e-tests/target/datastore-build-context/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Workflow toolchain image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: target/workflow-build-context
          file: target/workflow-build-context/workflow-frontend.Dockerfile
          tags: workflow-frontend-app-e2e:prebuild
          load: true
          push: false
          cache-from: type=gha,scope=benchmark-20261029T161034Z-workflow-toolchain
          cache-to: type=gha,scope=benchmark-20261029T161034Z-workflow-toolchain,mode=max

      - name: Build Datastore toolchain image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: e2e-tests/target/datastore-build-context
          file: e2e-tests/target/datastore-build-context/datastore.Dockerfile
          tags: workflow-datastore-e2e:prebuild
          load: true
          push: false
          cache-from: type=gha,scope=benchmark-20261029T161034Z-datastore-toolchain
          cache-to: type=gha,scope=benchmark-20261029T161034Z-datastore-toolchain,mode=max

      - name: Run Playwright tests
        env:
          E2E_WORKFLOW_IMAGE: workflow-frontend-app-e2e:prebuild
          E2E_DATASTORE_IMAGE: workflow-datastore-e2e:prebuild
        run: yarn bddgen && yarn playwright test

      - name: Chromatic - Workflow Frontend
        if: contains(github.event.pull_request.labels.*.name, 'run_chromatic')
        uses: chromaui/action@bb3b582719a93c1828c5e520e62992b2937d7889 # v18.9.4
        with:
          playwright: true
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: e2e-tests
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          CHROMATIC_ARCHIVE_LOCATION: ./target/test-results

      # Traces, videos and screenshots are written to target/test-results
      # (see outputDir in playwright.config.ts). Keep them for debugging
      # failed runs.
      - name: Upload Playwright traces and videos
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: e2e-tests/target/test-results
          retention-days: 7
          if-no-files-found: ignore
