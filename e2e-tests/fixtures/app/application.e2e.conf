# Play config overlay for running workflow-frontend in the e2e stack.
# Loaded via -Dconfig.file=.../application.e2e.conf (see images/start-app).
include "application"

# Datastore (run for real) — reached over the Docker network by alias, plain http.
api.url = "http://workflow-datastore:9093/api"

# Shared-secret endpoints.
api.sharedsecret = "e2e-shared-secret"
api.sharedsecret = ${?WORKFLOW_SHARED_SECRET}

# CAPI preview (mocked). Not exercised by the create-stub flow; dummy IAM values.
capi.key = "e2e-capi-key"
capi.preview.iamUrl = "http://capi-preview.local.dev-gutools.co.uk"
capi.preview.role = "arn:aws:iam::000000000000:role/e2e-capi-preview"

# Disable Play evolutions / secret comes from APPLICATION_SECRET env.
play.http.secret.key = ${?APPLICATION_SECRET}
