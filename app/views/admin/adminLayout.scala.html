@(tab: String, config: io.circe.Json)(content: Html)

@main("Admin") {

<div class="admin">

    <div class="container-fluid">

        <div class="row">
            <div class="col-md-12">
                <ul class="nav nav-tabs">
                    <li role="presentation" @if(tab == "desksAndSections"){class="active"}><a href="@routes.Admin.desksAndSections(None)">Desks and Sections</a></li>
                    <li role="presentation" @if(tab == "sectionsAndTags"){class="active"}><a href="@routes.Admin.sectionsAndTags(None)">Sections and Tags</a></li>
                </ul>
            </div>
        </div>

        @content

    </div>
</div>

<script type="application/json" id="config-json-script">
@Html(config.toString)
</script>
<script>
  CONFIG = JSON.parse(document.getElementById("config-json-script").textContent);
</script>

<script src="@routes.Assets.versioned("build/admin.bundle.js")"></script>
<link rel="stylesheet" type="text/css" href="@routes.Assets.versioned("build/admin.css")"/>

}
