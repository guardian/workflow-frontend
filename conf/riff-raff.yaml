stacks: [workflow]
regions: [eu-west-1]
deployments:
  cfn-workflow-frontend:
    type: cloud-formation
    parameters:
      templateStagePaths:
        CODE: Workflow-Frontend-euwest-1-CODE.template.json
        PROD: Workflow-Frontend-euwest-1-PROD.template.json
      cloudFormationStackName: Workflow-Frontend
      prependStackToCloudFormationStackName: false
      cloudFormationStackByTags: false
      amiParameter: AMI
      amiTags:
        AmigoStage: PROD
        Recipe: editorial-tools-jammy-java11
        BuiltBy: amigo
  workflow-frontend:
    type: autoscaling
    parameters:
    dependencies: [cfn-workflow-frontend]