---
  AWSTemplateFormatVersion: "2010-09-09"
  Description: "Workflow Frontend"
  Conditions:
    NotPROD:
      Fn::Not:
        -
          Fn::Equals:
            -
              Ref: "Stage"
            - "PROD"
    IsPROD:
      Fn::Equals:
        -
          Ref: "Stage"
        - "PROD"
    IsCODE:
      Fn::Equals:
        -
          Ref: "Stage"
        - "CODE"
  Mappings:
    WorkflowFrontendConfig:
      CODE:
        MinSize: 1
        MaxSize: 2
        DesiredCapacity: 1
        InstanceType: "t4g.medium"
        CloudfrontAliases:
          - "workflow.code.dev-gutools.co.uk"
      PROD:
        MinSize: 3
        MaxSize: 6
        DesiredCapacity: 3
        InstanceType: "t4g.medium"
        CloudfrontAliases:
          - "workflow.gutools.co.uk"
  Parameters:
    Stage:
      Description: "Environment name"
      Type: "String"
      AllowedValues:
        - "CODE"
        - "PROD"
      Default: "PROD"
    SSLCertificateArn:
      Description: "ARN of the SSL certificate for workflow.gutools.co.uk"
      Type: "String"
    CloudFrontSSLCertificateArn:
      Description: "The ARN of the certificate for the CloudFront distribution"
      Type: "String"
    AMI:
      Description: "AMI for Workflow instances"
      Type: "String"
    GithubTeamName:
      Description: "Name of github team to allow SSH access to"
      Type: "String"
      Default: "Editorial-Tools-SSHAccess"
    DatastoreLoadBalancerAccessSecurityGroupIdNewVpcPROD:
      Description: "The Workflow Data Store Security Group for PROD"
      Type: AWS::SSM::Parameter::Value<String>
      Default: /PROD/workflow/datastore/LoadBalancerAccessSecurityGroupId
    DatastoreLoadBalancerAccessSecurityGroupIdNewVpcCODE:
      Description: "The Workflow Data Store Security Group for CODE"
      Type: AWS::SSM::Parameter::Value<String>
      Default: /CODE/workflow/datastore/LoadBalancerAccessSecurityGroupId
    CloudFrontAccessLogsBucketName:
      Description: "Name of the bucket for cloudfront to log access logs to"
      Type: "String"
    CapiPreviewRole:
      Type: String
      Description: ARN of the CAPI preview role
    ELKKinesisStreamArn:
      Description: "Elk logging stream arn"
      Type: "String"
    ELKKinesisStreamName:
      Description: "Elk logging stream name"
      Type: "String"
    VpcId:
      Type: AWS::EC2::VPC::Id
      Description: The new VPC we look to migrate to
    PublicSubnets:
      Type: List<AWS::EC2::Subnet::Id>
      Description: The public subnets of the new VPC for the loadbalancer
    PrivateSubnets:
      Type: List<AWS::EC2::Subnet::Id>
      Description: The private subnets of the new VPC for the autoscaling group
  Resources:
    DistributionInstanceProfile:
      Type: "AWS::IAM::InstanceProfile"
      Properties:
        Path: "/"
        Roles:
          -
            Ref: "DistributionRole"
    DistributionRole:
      Type: "AWS::IAM::Role"
      Properties:
        AssumeRolePolicyDocument:
          Statement:
            -
              Effect: "Allow"
              Principal:
                Service:
                  - "ec2.amazonaws.com"
              Action:
                - "sts:AssumeRole"
        Path: "/"
        ManagedPolicyArns:
        - Fn::ImportValue: !Sub "guardian-ec2-for-ssm-GuardianEC2ForSSMPolicy"
        Policies:
          -
            PolicyName: "root"
            PolicyDocument:
              Statement:
                -
                  Effect: "Allow"
                  Action:
                    - "s3:GetObject"
                  Resource:
                    - "arn:aws:s3:::workflow-dist/*"
                    - "arn:aws:s3:::workflow-private/*"
                    - "arn:aws:s3:::pan-domain-auth-settings/*"
                    - "arn:aws:s3:::permissions-cache/*"
          -
            PolicyName: "PushLogs"
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                -
                  Effect: "Allow"
                  Action:
                    - "logs:*"
                  Resource:
                    - "arn:aws:logs:*:*:*"
          -
            PolicyName: "DescribeEC2Policy"
            PolicyDocument:
              Statement:
                -
                  Action:
                    - ec2:Describe*
                    - autoscaling:DescribeAutoScalingGroups
                    - autoscaling:DescribeAutoScalingInstances
                  Effect: "Allow"
                  Resource: "*"
          -
            PolicyName: "Dynamo"
            PolicyDocument:
              Statement:
                -
                  Action:
                    - "dynamodb:*"
                  Effect: "Allow"
                  Resource: "*"
    LogServerPolicy:
      Type: AWS::IAM::Policy
      Properties:
        PolicyName: LogServerPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - kinesis:PutRecord
                - kinesis:PutRecords
                - kinesis:DescribeStream
              Resource: !Ref ELKKinesisStreamArn
        Roles:
          - Ref: DistributionRole
    GetTeamKeysPolicy:
      Type: "AWS::IAM::Policy"
      Properties:
        PolicyName: "GetTeamKeysPolicy"
        PolicyDocument:
          Statement:
            -
              Effect: "Allow"
              Action:
                - "s3:GetObject"
              Resource:
                - "arn:aws:s3:::github-team-keys/*"
            -
              Effect: "Allow"
              Action:
                - "s3:ListBucket"
              Resource: "arn:aws:s3:::github-team-keys"
        Roles:
          -
            Ref: "DistributionRole"

    AssumeCapiPreviewRolePolicy:
      Type: AWS::IAM::Policy
      Properties:
        PolicyName: AssumeCapiPreviewRole
        PolicyDocument:
          Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Resource: !Ref CapiPreviewRole
        Roles:
          - !Ref DistributionRole

    AppServerSecurityGroupNewVpc:
      Type: "AWS::EC2::SecurityGroup"
      Properties:
        GroupDescription: "Application servers"
        SecurityGroupIngress:
          -
            IpProtocol: "tcp"
            FromPort: 9000
            ToPort: 9000
            SourceSecurityGroupId: !GetAtt LoadBalancerSecurityGroupNewVpc.GroupId
        VpcId: !Ref VpcId
    LoadBalancerSecurityGroupNewVpc:
      Type: "AWS::EC2::SecurityGroup"
      Properties:
        GroupDescription: "WorkflowFrontend application load balancer"
        SecurityGroupIngress:
          -
            IpProtocol: "tcp"
            FromPort: "80"
            ToPort: "80"
            CidrIp: "0.0.0.0/0"
          -
            IpProtocol: "tcp"
            FromPort: "443"
            ToPort: "443"
            CidrIp: "0.0.0.0/0"
        VpcId: !Ref VpcId
    WorkflowFrontendLoadBalancerNewVpc:
      Type: "AWS::ElasticLoadBalancing::LoadBalancer"
      Properties:
        CrossZone: true
        Subnets: !Ref PublicSubnets
        SecurityGroups:
          - !GetAtt LoadBalancerSecurityGroupNewVpc.GroupId
        Listeners:
          -
            LoadBalancerPort: "80"
            InstancePort: "9000"
            Protocol: "HTTP"
          -
            LoadBalancerPort: "443"
            InstancePort: "9000"
            Protocol: "HTTPS"
            SSLCertificateId:
              Ref: "SSLCertificateArn"
        HealthCheck:
          Target: "HTTP:9000/management/healthcheck"
          HealthyThreshold: "2"
          UnhealthyThreshold: "2"
          Interval: "10"
          Timeout: "5"
        AccessLoggingPolicy:
          EmitInterval: 5
          Enabled: true
          S3BucketName: "workflow-logs"
          S3BucketPrefix:
            Ref: "Stage"
        Tags:
          -
            Key: "Stage"
            Value:
              Ref: "Stage"
          -
            Key: "Stack"
            Value: "workflow"
          -
            Key: "App"
            Value: "workflow-frontend"
    WorkflowFrontendAutoscalingGroupNewVpc:
      Type: "AWS::AutoScaling::AutoScalingGroup"
      Properties:
        VPCZoneIdentifier: !Ref PrivateSubnets
        LaunchConfigurationName:
          Ref: "WorkflowFrontendLaunchConfigNewVpc"
        MinSize:
          Fn::FindInMap:
            - "WorkflowFrontendConfig"
            -
              Ref: "Stage"
            - "MinSize"
        MaxSize:
          Fn::FindInMap:
            - "WorkflowFrontendConfig"
            -
              Ref: "Stage"
            - "MaxSize"
        DesiredCapacity:
          Fn::FindInMap:
            - "WorkflowFrontendConfig"
            -
              Ref: "Stage"
            - "DesiredCapacity"
        Cooldown: "180"
        HealthCheckType: "ELB"
        HealthCheckGracePeriod: 300
        LoadBalancerNames:
          -
            Ref: "WorkflowFrontendLoadBalancerNewVpc"
        Tags:
          - Key: "Stage"
            Value:
              Ref: "Stage"
            PropagateAtLaunch: "true"
          - Key: "Stack"
            Value: "workflow"
            PropagateAtLaunch: "true"
          - Key: "App"
            Value: "workflow-frontend"
            PropagateAtLaunch: "true"
          - Key: LogKinesisStreamName
            Value: !Ref 'ELKKinesisStreamName'
            PropagateAtLaunch: 'true'
          - Key: SystemdUnit
            Value: workflow-frontend.service
            PropagateAtLaunch: 'true'
    WorkflowFrontendLaunchConfigNewVpc:
      Type: "AWS::AutoScaling::LaunchConfiguration"
      Properties:
        ImageId:
          Ref: "AMI"
        SecurityGroups:
          - !GetAtt AppServerSecurityGroupNewVpc.GroupId
          - Fn::If:
            - IsPROD
            - Ref: "DatastoreLoadBalancerAccessSecurityGroupIdNewVpcPROD"
            - Ref: "DatastoreLoadBalancerAccessSecurityGroupIdNewVpcCODE"
        InstanceType:
          Fn::FindInMap:
            - "WorkflowFrontendConfig"
            -
              Ref: "Stage"
            - "InstanceType"
        IamInstanceProfile:
          Ref: "DistributionInstanceProfile"
        MetadataOptions:
          HttpTokens: required
        UserData:
          Fn::Base64:
            !Sub |
              #!/bin/bash -ev
              aws s3 cp s3://workflow-private/${Stage}/workflow-frontend/application.defaults.conf /etc/gu/application.defaults.conf
              aws s3 cp s3://workflow-private/keys.conf /etc/gu/workflow-keys.conf
              aws s3 cp s3://workflow-dist/workflow/${Stage}/workflow-frontend/workflow-frontend_0.1_all.deb /tmp
              dpkg -i /tmp/workflow-frontend_0.1_all.deb

    WorkflowFrontendGroup:
      Type: "AWS::IAM::Group"
      Properties:
        Policies:
          -
            PolicyName: "WorkflowFrontendGroup-Policy"
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                -
                  Effect: "Allow"
                  Action:
                    - "sqs:DeleteMessage"
                    - "sqs:ReceiveMessage"
                  Resource: "*"
                -
                  Effect: "Allow"
                  Action:
                    - "ec2:DescribeTags"
                    - "cloudwatch:PutMetricData"
                  Resource: "*"
    WorkflowFrontendCloudfront:
      Type: "AWS::CloudFront::Distribution"
      Properties:
        DistributionConfig:
          HttpVersion: http2
          IPV6Enabled: true
          Aliases:
            Fn::FindInMap:
              - "WorkflowFrontendConfig"
              -
                Ref: "Stage"
              - "CloudfrontAliases"
          Origins:
            -
              CustomOriginConfig:
                HTTPSPort: "443"
                OriginProtocolPolicy: "https-only"
              DomainName:
                Fn::GetAtt:
                  - "WorkflowFrontendLoadBalancerNewVpc"
                  - "DNSName"
              Id: "workflow-frontend"
          DefaultCacheBehavior:
            AllowedMethods:
              - "DELETE"
              - "GET"
              - "HEAD"
              - "OPTIONS"
              - "PATCH"
              - "POST"
              - "PUT"
            Compress: true
            ForwardedValues:
              Headers:
                - "*"
              QueryString: true
              Cookies:
                Forward: "all"
            TargetOriginId: "workflow-frontend"
            ViewerProtocolPolicy: "redirect-to-https"
          CacheBehaviors:
            -
              PathPattern: "assets/*"
              Compress: true
              ForwardedValues:
                QueryString: false
                Headers:
                  - "Host"
              TargetOriginId: "workflow-frontend"
              ViewerProtocolPolicy: "redirect-to-https"
          PriceClass: "PriceClass_All"
          Enabled: "true"
          ViewerCertificate:
            AcmCertificateArn:
              Ref: "CloudFrontSSLCertificateArn"
            MinimumProtocolVersion: "TLSv1.2_2021"
            SslSupportMethod: "sni-only"
          Logging:
            Bucket: { "Fn::Join": [ "", [{"Ref":"CloudFrontAccessLogsBucketName"}, ".s3.amazonaws.com"] ] }
            IncludeCookies: "false"
            Prefix: { "Fn::Join": [ "", [{"Ref":"Stage"}, "-access-logs/"] ] }

    RunWorkflowFrontendLocally:
      Type: AWS::IAM::ManagedPolicy
      Condition: IsCODE
      Properties:
        Description: Policy used for running workflow-frontend locally
        Path: !Sub "/developer-policy/guardian/workflow-frontend/workflow/${Stage}/run-workflow-frontend-locally/"
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: "Allow"
              Action:
                - "s3:GetObject"
              Resource:
                - "arn:aws:s3:::workflow-private/DEV/workflow-frontend-application.local.docker.conf"
                - "arn:aws:s3:::workflow-private/DEV/workflow-frontend-application.local.conf"
                - "arn:aws:s3:::permissions-cache/CODE/permissions.json"
                - "arn:aws:s3:::pan-domain-auth-settings/local.dev-gutools.co.uk.settings"
                - "arn:aws:s3:::pan-domain-auth-settings/local.dev-gutools.co.uk.settings.public"
                - "arn:aws:s3:::pan-domain-auth-settings/*.p12"
            - Effect: "Allow"
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/editorial-support-CODE"

  Outputs:
    WorkflowFrontendLoadBalancerDNS:
      Description: "Load balancer DNS"
      Value:
        Fn::GetAtt:
          - "WorkflowFrontendLoadBalancerNewVpc"
          - "DNSName"
    WorkflowFrontendCloudfrontDNS:
      Description: "Cloudfront DNS"
      Value:
        Fn::GetAtt:
          - "WorkflowFrontendCloudfront"
          - "DomainName"
